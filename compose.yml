services:
  novadb:
    build: .
    ports:
      - "8080:8080"
    environment:
      NOVADB_API_KEY: ${NOVADB_API_KEY:?set NOVADB_API_KEY}
      NOVADB_DATABASE: default
      NOVADB_DATA_DIR: /data
      NOVADB_MAX_BODY_BYTES: 4194304
      NOVADB_MAX_BATCH_SIZE: 1000
      RUST_LOG: novadb_server=info,tower_http=info
    volumes:
      - novadb-data:/data
    restart: unless-stopped

volumes:
  novadb-data:
