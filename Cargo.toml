[package]
name = "novadb"
version = "0.1.0"
edition = "2021"
description = "A lightweight embedded vector database built from scratch in Rust"
license = "MIT"
repository = "https://github.com/anomalyco/novadb"

[workspace]
members = ["cli", "benchmarks"]
resolver = "2"

[lib]
name = "novadb"
path = "src/lib.rs"

[dependencies]
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1
