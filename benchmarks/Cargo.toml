[package]
name = "novadb-benchmarks"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
novadb = { path = ".." }

[dev-dependencies]
criterion = "0.5"
rand = "0.8"
rand_chacha = "0.3"
serde_json = "1"
tempfile = "3"

[[bench]]
name = "search"
harness = false

[[bench]]
name = "insert"
harness = false

[lib]
name = "novadb_benchmarks"
path = "src/lib.rs"
