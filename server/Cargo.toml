[package]
name = "novadb-server"
version = "0.1.0"
edition = "2021"
description = "HTTP server for NovaDB BYOS"

[dependencies]
novadb = { path = ".." }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[[bin]]
name = "novadb-server"
path = "src/main.rs"
